[project]
name = "up-journey-backend"
version = "1.0.0"
description = "up-journey family travel journal — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "alembic>=1.13",
    "pymysql>=1.1",
    "cryptography>=42.0",
    "pillow>=10.4",
    "pillow-heif>=0.17",
    "pypinyin>=0.53",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = false
