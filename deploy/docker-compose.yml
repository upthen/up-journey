# up-journey 生产编排：nginx（前端静态 + /api 反代）+ api + mysql
# 镜像均为 linux/arm64（绿联 DH4300 Plus · UGOS Pro）。
# 所有环境差异走同目录 .env（见 .env.example）。
name: up-journey

services:
  nginx:
    image: up-journey/nginx:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "8100:80" # 对外唯一端口；公网反代前务必先启用鉴权（见 docs/deployment.md）
      - "8443:8443" # 公网 HTTPS（IPv6 直连）；证书由 acme.sh 挂载到 /etc/nginx/certs
    volumes:
      - ./certs/journey.yongbo.life_ecc:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    image: up-journey/api:latest
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    restart: unless-stopped
    env_file: .env # ADMIN_PASSWORD 等随 .env 注入（DATABASE_URL 仍显式覆盖为容器内地址）
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?charset=utf8mb4
      PHOTOS_DIR: /photos # 共享相册：只读挂载，应用绝不写入
      CACHE_DIR: /cache # 缩略图缓存：应用私有卷
    volumes:
      - ${PHOTOS_HOST_DIR}:/photos:ro
      - cache:/cache
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 40s

  mysql:
    image: mysql:latest  # 直接复用 NAS 上已有镜像（26.x，arm64）；utf8mb4 参数兼容
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # 不映射宿主机端口（安全边界：只有 api 容器能访问）

volumes:
  mysql_data:
  cache:
