server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API 反代到 uvicorn
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s; # 首次生成大图缓存可能较慢
    }

    # 带内容哈希的静态资源：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 离线地图数据
    location = /china.json {
        expires 30d;
    }

    # SPA 回落
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 公网 HTTPS 入口（家宽非标端口；证书由 acme.sh DNS-01 签发，60 天自动续期）
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name journey.yongbo.life;

    ssl_certificate /etc/nginx/certs/fullchain.cer;
    ssl_certificate_key /etc/nginx/certs/journey.yongbo.life.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /china.json {
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
